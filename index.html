  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

<body class="font-sans antialiased pb-24 h-screen flex flex-col">

  <header class="bg-surface/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
    <div class="px-5 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-teal-600 flex items-center justify-center shadow-lg shadow-primary/20">
          <i class="fas fa-industry text-gray-900 text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-black text-white tracking-wide leading-none">CHECKER</h1>
          <p class="text-[9px] font-bold text-gray-500 tracking-widest mt-1 uppercase">Sewing Management</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="ui.showAdminSelector()" class="flex items-center gap-2 bg-gray-900 border border-gray-700 rounded-full py-1 pl-1 pr-3 hover:bg-gray-800 transition-colors">
          <div id="admin-avatar" class="w-7 h-7 rounded-full bg-red-500/20 border border-red-500 text-red-500 flex items-center justify-center animate-pulse">
            <i class="fas fa-exclamation text-[10px]"></i>
          </div>
          <span id="admin-name" class="text-xs font-bold text-red-400">Pilih Admin</span>
        </button>
        <button onclick="ui.showSettings()" class="w-9 h-9 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-400 flex items-center justify-center transition-colors border border-gray-700">
          <i class="fas fa-cog"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto hide-scrollbar p-5 space-y-6" id="main-content">
    <div id="view-karyawan" class="hidden"></div>
    <div id="view-produksi" class="hidden"></div>
    <div id="view-laporan" class="hidden"></div>
  </main>

  <nav class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-lg border-t border-gray-800 px-6 py-3 z-50">
    <div class="flex justify-between items-center max-w-md mx-auto relative">
      <button onclick="ui.switchTab('karyawan')" id="nav-karyawan" class="flex flex-col items-center gap-1.5 w-16 transition-colors text-gray-500">
        <i class="fas fa-users text-xl"></i>
        <span class="text-[10px] font-bold">Karyawan</span>
      </button>
      
      <div class="absolute left-1/2 -translate-x-1/2 -top-8">
        <button onclick="ui.switchTab('produksi')" id="nav-produksi" class="w-16 h-16 bg-gradient-to-br from-primary to-teal-500 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(45,220,203,0.4)] text-gray-900 border-4 border-[#0f172a] transform transition-transform active:scale-95">
          <i class="fas fa-cut text-2xl"></i>
        </button>
        <span class="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-bold text-primary">Produksi</span>
      </div>

      <button onclick="ui.switchTab('laporan')" id="nav-laporan" class="flex flex-col items-center gap-1.5 w-16 transition-colors text-gray-500">
        <i class="fas fa-chart-pie text-xl"></i>
        <span class="text-[10px] font-bold">Laporan</span>
      </button>
    </div>
  </nav>

  <div id="modal-container"></div>
  <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase configuration for the CHECKER production project.
    // This web configuration is safe to include in a frontend application;
    // access control is enforced separately with Firestore Security Rules.
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCSh-vkJmORt0fR25EO9_iOMjL6RZjib7c",
  authDomain: "checker-sewing-management.firebaseapp.com",
  projectId: "checker-sewing-management",
  storageBucket: "checker-sewing-management.firebasestorage.app",
  messagingSenderId: "505916504453",
  appId: "1:505916504453:web:daa0feed33b76a88be2cec",
  measurementId: "G-CF8BF35Y3E"
};

    // All devices must use the same shared Firestore collections.
    // The previous version stored data under each anonymous user's UID,
    // which made data appear separate on different phones.
    const appId = 'checker-sewing-management';
    const DATA_ROOT = 'checker';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const defaultMaster = {
      corak: ["Bunga", "Polos", "Batik", "Abstrak", "Kotak", "Garis", "Salur", "Pucuk", "Daun", "Awan", "Mega", "Truntum", "Kombinasi", "Anak", "Dewasa"],
      kode: ["B01", "B02", "P01", "P02", "A01", "A02", "K01", "K02", "RTK"],
      grid: ["A1", "A2", "B1", "B2", "C1", "C2", "D1", "D2", "E1", "E2", "F1", "F2"],
      label: ["Label Leher", "Label Samping", "Label Ukuran", "Washing", "Hangtag", "Woven"],
      admin: ["Admin 1", "Admin 2"]
    };

    // Pemetaan Corak ke Kode Corak (Dapat diedit dan ditambah sesuai kebutuhan)
    const pemetaanCorakKode = {
      "Bunga": ["B01", "B02"],
      "Polos": ["P01", "P02"],
      "Abstrak": ["A01", "A02"],
      "Batik": ["K01", "K02", "RTK"],
      "Kotak": ["K01", "K02"],
      "Kombinasi": ["RTK"]
    };

    const state = {
      tab: 'produksi', 
      karyawan: [], produksi: [], absensi: [], 
      master: { corak: [], kode: [], grid: [], admin: [], label: [] }, 
      userId: null,
      currentAdmin: localStorage.getItem('checker_active_admin') || '',
      form: { karyawanId: '', step: 1, corak: '', kodeCorak: '', jenisLabel: '', grid: '', pcs: '' },
      catatanLaporan: ''
    };

    function getToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

        function docPath(col, docId) { return doc(db, col, docId); }
    function colPath(col) { return collection(db, col); }

    window.api = {
      deleteKaryawan(id) {
        if (!state.userId) return;
        ui.closeModal();
        setDoc(docPath('karyawan', id), { deleted: true }, { merge: true })
          .then(() => ui.toast('Karyawan dihapus', 'success'));
      },
            saveKaryawan(e) {
        e.preventDefault();
        if (!state.userId) {
          ui.toast('Koneksi belum siap, coba sesaat lagi', 'error');
          return;
        }

        const inputId = document.getElementById('karyawan-id').value;
        const generatedId = 'karyawan_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const id = inputId || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : generatedId);

        const data = {
          id,
          nama: document.getElementById('karyawan-nama').value,
          nik: document.getElementById('karyawan-nik').value,
          statusOp: document.getElementById('karyawan-statusOp').value,
          hariLibur: document.getElementById('karyawan-hariLibur').value,
          timestamp: Date.now()
        };

        const submitBtn = e.target.querySelector('button[type="submit"]');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerText = 'Menyimpan...';
        }

        setDoc(docPath('karyawan', id), data)
          .then(() => {
            ui.closeModal();
            ui.toast('Data Karyawan Tersimpan', 'success');
          })
          .catch(err => {
            console.error(err);
            ui.toast(`Gagal: ${err.message}`, 'error');
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerText = 'Simpan Data';
            }
          });
      },

      updateAbsen(karyawanId, status) {
        if (!state.userId) return;
        const id = `${karyawanId}_${getToday()}`;
        setDoc(docPath('absensi', id), {
          id, karyawanId, status, tanggal: getToday(), timestamp: Date.now()
        });
      },
      saveMaster(type, value) {
        if(!state.userId || !value.trim()) return;
        const id = 'master_data';
        const currentData = state.master[type] || [];
        if(!currentData.includes(value.trim())) {
          currentData.push(value.trim());
          setDoc(docPath('master', id), { [type]: currentData }, {merge: true})
            .then(() => ui.renderMasterSettings(type));
        }
      },
      deleteMaster(type, value) {
        if(!state.userId) return;
        const id = 'master_data';
        const currentData = (state.master[type] || []).filter(v => v !== value);
        setDoc(docPath('master', id), { [type]: currentData }, {merge: true})
          .then(() => ui.renderMasterSettings(type));
      },
      deleteProduksi(id) {
        if (!state.userId) return;
        deleteDoc(docPath('produksi', id)).then(() => {
          ui.toast('Data produksi dihapus', 'success');
          ui.closeModal();
        }).catch(e => {
          console.error(e);
          ui.toast('Gagal menghapus data', 'error');
          ui.closeModal();
        });
      },
      saveProduksiWizard() {
        if (!state.userId) return;
        if (!state.currentAdmin) { ui.showAdminSelector(); return ui.toast('Pilih Admin Aktif terlebih dahulu!', 'error'); }

        const { karyawanId, corak, kodeCorak, jenisLabel, grid, pcs } = state.form;
        const k = state.karyawan.find(x => x.id === karyawanId);
        const isLabelOp = k && k.statusOp === 'Op. Jahit Label';

        if (!karyawanId || !corak || !kodeCorak || !grid || !pcs || pcs <= 0 || (isLabelOp && !jenisLabel)) {
           return ui.toast('Data belum lengkap!', 'error');
        }
        
        const data = { 
          karyawanId, karyawanNama: k.nama, corak, kodeCorak, jenisLabel: (isLabelOp ? jenisLabel : ''), grid, 
          pcs: Number(pcs), kodi: (Number(pcs) / 20).toFixed(2), adminName: state.currentAdmin 
        };
        const id = crypto.randomUUID();
        
        const btn = document.getElementById('btn-simpan-wizard');
        if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; btn.disabled = true; }

        setDoc(docPath('produksi', id), { id, ...data, tanggal: getToday(), timestamp: Date.now() })
        .then(() => {
                    // --- KIRIM OTOMATIS KE GOOGLE SHEETS ---
          const GAS_URL = 'PASTE_URL_DARI_APPS_SCRIPT_DISINI';
          if (GAS_URL && !GAS_URL.includes('PASTE_URL')) {
            fetch(GAS_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                ...data,
                statusOp: k.statusOp,
                tanggal: getToday(),
                timestamp: Date.now()
              })
            }).catch(err => console.warn('Sheets sync error:', err));
          }

          ui.toast('Data produksi tersimpan', 'success');
          state.form.step = 1;
          state.form.corak = '';
          state.form.kodeCorak = '';
          state.form.jenisLabel = '';
          state.form.grid = '';
          state.form.pcs = '';
          ui.renderProduksi();
        }).catch(e => {
          ui.toast('Error menyimpan', 'error');
          if (btn) { btn.innerHTML = '<i class="fas fa-save"></i> Simpan Data Produksi'; btn.disabled = false; }
        });
      },
      async resetDataHariIni() {
        if (!state.userId) return;
        const today = getToday();
        
        // Find all production IDs for today from the local state
        const docsToDelete = state.produksi.filter(p => p.tanggal === today).map(p => p.id);
        
        if (docsToDelete.length === 0) {
            ui.toast('Tidak ada data produksi hari ini untuk direset', 'success');
            ui.closeModal();
            return;
        }

        const btn = document.getElementById('btn-reset-confirm');
        if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mereset...'; btn.disabled = true; }

        try {
            // Delete documents sequentially to avoid complex batched writes setup for this context
            for (const id of docsToDelete) {
                 await deleteDoc(docPath('produksi', id));
            }
            ui.toast(`Berhasil mereset ${docsToDelete.length} data produksi hari ini`, 'success');
            ui.closeModal();
        } catch (error) {
            console.error("Error resetting data:", error);
            ui.toast('Gagal mereset data', 'error');
            if (btn) { btn.innerHTML = 'Ya, Reset Data'; btn.disabled = false; }
        }
      }
    };

    window.ui = {
      toast(msg, type='success') {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        const color = type === 'success' ? 'bg-green-500' : 'bg-red-500';
        const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
        t.className = `${color} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 fade-in font-bold text-sm pointer-events-auto`;
        t.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
        c.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
      },
      closeModal() { document.getElementById('modal-container').innerHTML = ''; },
      
      showDeleteProduksiConfirmation(id) {
        const html = `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-5 z-[110] fade-in">
            <div class="bg-surface w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl border border-red-900/50">
              <div class="bg-red-900/20 p-5 flex flex-col items-center text-center border-b border-red-900/30">
                <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center text-3xl mb-3">
                  <i class="fas fa-trash-alt"></i>
                </div>
                <h3 class="font-black text-white text-lg">Hapus Data Produksi?</h3>
                <p class="text-xs text-gray-400 mt-2">Data ini akan dihapus permanen dari sistem dan otomatis mengurangi perolehan total.</p>
              </div>
              <div class="p-5 grid grid-cols-2 gap-3">
                <button onclick="ui.closeModal()" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl transition-colors">Batal</button>
                <button onclick="api.deleteProduksi('${id}')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition-colors flex items-center justify-center gap-2">Ya, Hapus</button>
              </div>
            </div>
          </div>`;
        document.getElementById('modal-container').innerHTML = html;
      },

      switchTab(t) {
        state.tab = t;
        ['karyawan', 'produksi', 'laporan'].forEach(id => {
          const btn = document.getElementById(`nav-${id}`);
          if (btn && id !== 'produksi') {
            btn.className = `flex flex-col items-center gap-1.5 w-16 transition-colors ${t === id ? 'text-primary' : 'text-gray-500 hover:text-gray-400'}`;
          }
          document.getElementById(`view-${id}`).classList.toggle('hidden', t !== id);
        });
        
        if (t === 'karyawan') this.renderKaryawan();
        if (t === 'produksi') this.renderProduksi();
        if (t === 'laporan') this.renderLaporan();
      },

      updateAdminUI() {
        const av = document.getElementById('admin-avatar');
        const nm = document.getElementById('admin-name');
        if (state.currentAdmin) {
          av.className = 'w-7 h-7 rounded-full bg-primary/20 border border-primary text-primary flex items-center justify-center text-[10px] font-bold uppercase';
          av.innerHTML = state.currentAdmin.substring(0,2);
          nm.className = 'text-xs font-bold text-gray-300';
          nm.innerText = state.currentAdmin;
        } else {
          av.className = 'w-7 h-7 rounded-full bg-red-500/20 border border-red-500 text-red-500 flex items-center justify-center animate-pulse';
          av.innerHTML = '<i class="fas fa-exclamation text-[10px]"></i>';
          nm.className = 'text-xs font-bold text-red-400';
          nm.innerText = 'Pilih Admin';
        }
      },

      showAdminSelector() {
        const mAdmin = state.master.admin && state.master.admin.length > 0 ? state.master.admin : defaultMaster.admin;
        const adminButtonsHtml = mAdmin.map(a => `
          <button onclick="ui.setAdmin('${a}')" class="w-full bg-gray-800 hover:bg-gray-700 p-4 rounded-xl text-left border ${state.currentAdmin === a ? 'border-primary' : 'border-gray-700'} flex items-center gap-3 transition-colors">
            <div class="w-10 h-10 rounded-full ${state.currentAdmin === a ? 'bg-primary text-gray-900' : 'bg-gray-700 text-white'} flex items-center justify-center font-bold">
              ${a.substring(0,2).toUpperCase()}
            </div>
            <span class="font-bold text-white flex-1">${a}</span>
            ${state.currentAdmin === a ? '<i class="fas fa-check-circle text-primary text-xl"></i>' : ''}
          </button>
        `).join('');

        const html = `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-5 z-[100] fade-in">
            <div class="bg-surface w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl border border-gray-800">
              <div class="bg-gray-900 p-5 flex justify-between items-center border-b border-gray-800">
                <h3 class="font-black text-white text-lg"><i class="fas fa-user-shield text-primary mr-2"></i>Pilih Admin Aktif</h3>
                <button onclick="ui.closeModal()" class="text-gray-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
              </div>
              <div class="p-5 space-y-3 max-h-[60vh] overflow-y-auto">
                ${adminButtonsHtml}
              </div>
            </div>
          </div>`;
        document.getElementById('modal-container').innerHTML = html;
      },

      setAdmin(name) {
        state.currentAdmin = name;
        localStorage.setItem('checker_active_admin', name);
        this.updateAdminUI();
        this.closeModal();
        this.toast(`Admin aktif: ${name}`);
      },

      showSettings() {
        const html = `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-5 z-[100] fade-in">
            <div class="bg-surface w-full max-w-md rounded-3xl overflow-hidden shadow-2xl border border-gray-800 flex flex-col max-h-[90vh]">
              <div class="bg-gray-900 p-5 flex justify-between items-center border-b border-gray-800">
                <h3 class="font-black text-white text-lg"><i class="fas fa-cog text-primary mr-2"></i>Pengaturan</h3>
                <button onclick="ui.closeModal()" class="text-gray-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
              </div>
              <div class="p-5 space-y-4 overflow-y-auto hide-scrollbar">
                <button onclick="ui.renderMasterSettings('admin')" class="w-full bg-gray-800 hover:bg-gray-700 p-4 rounded-xl flex items-center justify-between border border-gray-700 transition-colors">
                  <div class="flex items-center gap-3 text-white font-bold"><i class="fas fa-users-cog text-primary w-5"></i> Kelola Admin</div>
                  <i class="fas fa-chevron-right text-gray-500"></i>
                </button>
                <button onclick="ui.renderMasterSettings('corak')" class="w-full bg-gray-800 hover:bg-gray-700 p-4 rounded-xl flex items-center justify-between border border-gray-700 transition-colors">
                  <div class="flex items-center gap-3 text-white font-bold"><i class="fas fa-swatchbook text-primary w-5"></i> Master Corak</div>
                  <i class="fas fa-chevron-right text-gray-500"></i>
                </button>
                <button onclick="ui.renderMasterSettings('kode')" class="w-full bg-gray-800 hover:bg-gray-700 p-4 rounded-xl flex items-center justify-between border border-gray-700 transition-colors">
                  <div class="flex items-center gap-3 text-white font-bold"><i class="fas fa-tags text-primary w-5"></i> Master Kode</div>
                  <i class="fas fa-chevron-right text-gray-500"></i>
                </button>
                <button onclick="ui.renderMasterSettings('label')" class="w-full bg-gray-800 hover:bg-gray-700 p-4 rounded-xl flex items-center justify-between border border-gray-700 transition-colors">
                  <div class="flex items-center gap-3 text-white font-bold"><i class="fas fa-tag text-primary w-5"></i> Master Label</div>
                  <i class="fas fa-chevron-right text-gray-500"></i>
                </button>
                <button onclick="ui.renderMasterSettings('grid')" class="w-full bg-gray-800 hover:bg-gray-700 p-4 rounded-xl flex items-center justify-between border border-gray-700 transition-colors">
                  <div class="flex items-center gap-3 text-white font-bold"><i class="fas fa-border-all text-primary w-5"></i> Master Grid Lokasi</div>
                  <i class="fas fa-chevron-right text-gray-500"></i>
                </button>
                <div class="h-px bg-gray-800 my-2"></div>
                <button onclick="ui.showResetConfirmation()" class="w-full bg-red-900/20 hover:bg-red-900/40 border border-red-900/50 p-4 rounded-xl flex items-center justify-between transition-colors">
                  <div class="flex items-center gap-3 text-red-400 font-bold"><i class="fas fa-trash-alt w-5"></i> Reset Data Hari Ini</div>
                  <i class="fas fa-chevron-right text-red-900/50"></i>
                </button>
              </div>
            </div>
          </div>`;
        document.getElementById('modal-container').innerHTML = html;
      },

      showResetConfirmation() {
        const html = `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-5 z-[110] fade-in">

      getAutoStatus(karyawan) {
        const todayNum = new Date().getDay(); 
        const mapHari = { "Minggu": 0, "Senin": 1, "Selasa": 2, "Rabu": 3, "Kamis": 4, "Jumat": 5, "Sabtu": 6 };

        const todayDate = getToday();
        const explicitAbsen = state.absensi.find(a => a.karyawanId === karyawan.id && a.tanggal === todayDate);
        
        if (explicitAbsen) return explicitAbsen.status;
        return isLibur ? 'Libur Harian' : 'Hadir';

      setFormOperator(id) {
        state.form = { karyawanId: id, step: 1, corak: '', kodeCorak: '', jenisLabel: '', grid: '', pcs: '' };
        this.renderProduksi();
      },

      setFormStep(s) {
        state.form.step = s;
        this.renderProduksi();
      },

      selectWizardData(field, val) {
        state.form[field] = val;
        const { karyawanId, step } = state.form;
        const k = state.karyawan.find(x => x.id === karyawanId);
        const isLabelOp = k && k.statusOp === 'Op. Jahit Label';
        
        if (field === 'corak') {
          state.form.step = 2;
          // Reset Kode Corak jika tidak valid untuk Corak yang baru dipilih
          const allowedKode = pemetaanCorakKode[val] || [];
          if (state.form.kodeCorak && !allowedKode.includes(state.form.kodeCorak)) {
            state.form.kodeCorak = '';
          }
        }
        else if (field === 'kodeCorak') state.form.step = 3;
        else if (field === 'jenisLabel') state.form.step = 4;
        else if (field === 'grid') state.form.step = isLabelOp ? 5 : 4;
        
        this.renderProduksi();
      },

      updateWizardPcs(val) {
        state.form.pcs = val;
        const pcsNum = Number(val) || 0;
        const kodi = (pcsNum / 20).toFixed(2);
        
        const kodiEl = document.getElementById('preview-kodi-wizard');
        if (kodiEl) kodiEl.innerText = kodi;
        
        const btn = document.getElementById('btn-simpan-wizard');
        if (btn) {
          const selectedKaryawan = state.karyawan.find(k => k.id === state.form.karyawanId);
          const isLabelOp = selectedKaryawan && selectedKaryawan.statusOp === 'Op. Jahit Label';
          const isValid = pcsNum > 0 && state.form.corak && state.form.kodeCorak && state.form.grid && (!isLabelOp || state.form.jenisLabel);
          
          if (isValid) {
            btn.className = 'w-full text-lg font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 bg-primary text-gray-900 shadow-[0_5px_20px_rgba(45,220,203,0.3)] hover:scale-[1.02] cursor-pointer';
          } else {
            btn.className = 'w-full text-lg font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 bg-gray-800 text-gray-500 border border-gray-700 cursor-not-allowed';
          }
        }
      },

      addWizardPcs(add) {
        const current = Number(state.form.pcs) || 0;
        const total = current + add;
        const input = document.getElementById('input-pcs-wizard');
        if (input) {
          input.value = total;
          this.updateWizardPcs(total);
        } else {
          this.updateWizardPcs(total);
        }
      },

              </div>
            `;

          html += `</div></div>`;

        html += `
          <div class="bg-surface p-5 rounded-2xl shadow-md border border-gray-800">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700/50 pb-3">

      renderLaporan() {
        const container = document.getElementById('view-laporan');
        const today = getToday();
        const prodToday = state.produksi.filter(p => p.tanggal === today);
        const activeKaryawan = state.karyawan.filter(k => !k.deleted);
        
        const prodPolos = prodToday.filter(p => {
            const k = state.karyawan.find(x => x.id === p.karyawanId);
            return k && k.statusOp !== 'Op. Jahit Label';
        });
        const prodLabel = prodToday.filter(p => {
            const k = state.karyawan.find(x => x.id === p.karyawanId);
            return k && k.statusOp === 'Op. Jahit Label';
        });

        const totalPcsPolos = prodPolos.reduce((s, p) => s + Number(p.pcs), 0);
        const totalKodiPolos = (totalPcsPolos / 20).toFixed(2);
        
        const totalPcsLabel = prodLabel.reduce((s, p) => s + Number(p.pcs), 0);
        const totalKodiLabel = (totalPcsLabel / 20).toFixed(2);

        const gridData = {}, corakData = {};
        prodPolos.forEach(p => {
          gridData[p.grid] = (gridData[p.grid] || 0) + Number(p.pcs);
          const ck = `${p.corak} - ${p.kodeCorak}`;
          corakData[ck] = (corakData[ck] || 0) + Number(p.pcs);
        });

        const labelData = {};
        prodLabel.forEach(p => {
          if (p.jenisLabel) {
            labelData[p.jenisLabel] = (labelData[p.jenisLabel] || 0) + Number(p.pcs);
          }
        });

        let hadirPolos = 0;
        let hadirLabel = 0;
        let listTidakHadir = [];

        activeKaryawan.forEach(k => {
          const status = this.getAutoStatus(k);
          if (status === 'Hadir') {
            if (k.statusOp === 'Op. Jahit Label') hadirLabel++;
            else hadirPolos++;
          } else {
            listTidakHadir.push({ nama: k.nama, status: status, pos: k.statusOp });
          }
        });
        const totalHadir = hadirPolos + hadirLabel;

        let htmlTidakHadir = '';
        if(listTidakHadir.length > 0) {
            const tkHtml = listTidakHadir.map(k => `
              <div class="flex justify-between items-center bg-gray-900 p-2.5 rounded-lg border border-gray-800">
                <div>
                  <p class="text-xs font-bold text-white">${k.nama}</p>
                  <p class="text-[9px] text-gray-500">${k.pos}</p>
                </div>
                <span class="text-[10px] font-bold px-2 py-1 rounded bg-gray-800 border border-gray-700 text-yellow-500">${k.status}</span>
              </div>
            `).join('');
            htmlTidakHadir = `
              <div class="mt-2 space-y-2">
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-2">Daftar Tidak Hadir:</p>
                ${tkHtml}
              </div>`;
        } else {
            htmlTidakHadir = '<p class="text-xs text-center text-green-400 font-bold mt-4 bg-green-500/10 p-2 rounded-lg">Semua karyawan hadir hari ini!</p>';
        }

        const corakItemsHtml = Object.keys(corakData).length > 0 ? Object.entries(corakData).sort((a,b) => b[1]-a[1]).map(([ck, v]) => `
          <div class="flex justify-between items-center bg-gray-900 p-3 rounded-xl border border-gray-800">
            <span class="text-xs font-bold text-gray-300">${ck}</span>
            <div class="text-right">
              <span class="text-sm font-black text-white">${v} <span class="text-[9px] text-gray-500 font-normal">PCS</span></span>
              <span class="text-[10px] font-bold text-secondary ml-2">${(v/20).toFixed(2)} Kodi</span>
            </div>
          </div>
        `).join('') : '<p class="text-xs text-gray-500 text-center py-4">Belum ada data</p>';

        const labelItemsHtml = Object.keys(labelData).length > 0 ? Object.entries(labelData).sort((a,b) => b[1]-a[1]).map(([lbl, v]) => `
          <div class="flex justify-between items-center bg-gray-900 p-3 rounded-xl border border-gray-800">
            <span class="text-xs font-bold text-gray-300">${lbl}</span>
            <div class="text-right">
              <span class="text-sm font-black text-white">${v} <span class="text-[9px] text-gray-500 font-normal">PCS</span></span>
              <span class="text-[10px] font-bold text-blue-400 ml-2">${(v/20).toFixed(2)} Kodi</span>
            </div>
          </div>
        `).join('') : '<p class="text-xs text-gray-500 text-center py-4">Belum ada data label</p>';

        const kPcsHtml = activeKaryawan.filter(k => k.statusOp !== 'Op. Jahit Label').map(k => {
          const kPcs = prodPolos.filter(p => p.karyawanId === k.id).reduce((s,p) => s + Number(p.pcs), 0);
          if(kPcs === 0) return '';
          return `
            <button type="button" onclick="ui.showDetailKinerja('${k.id}', '${k.nama}')" class="w-full flex justify-between items-center bg-gray-900 p-3 rounded-xl border border-gray-800 cursor-pointer hover:border-primary/50 transition-all active:scale-95 text-left">
              <span class="text-sm font-bold text-white">${k.nama}</span>
              <div class="text-right">
                <span class="text-sm font-black text-primary">${kPcs} PCS</span>
                <p class="text-[10px] text-secondary">${(kPcs/20).toFixed(2)} Kodi</p>
              </div>
            </button>
          `;
        }).join('');

        let html = `
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-white">Dashboard Laporan</h2>
            <button onclick="ui.showDownloadOptions()" class="bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-xl shadow-[0_4px_15px_rgba(99,102,241,0.3)] hover:scale-105 transition-transform flex items-center gap-2">
              <i class="fas fa-download"></i> Unduh
            </button>
          </div>

          <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-gradient-to-br from-green-500/20 to-green-600/10 border border-green-500/30 p-5 rounded-2xl shadow-lg relative overflow-hidden">
              <div class="absolute -right-4 -top-4 text-green-500/10"><i class="fas fa-tshirt text-7xl"></i></div>
              <p class="text-[10px] font-bold text-green-400 uppercase tracking-widest mb-1 relative z-10">Hasil Op. Polos</p>
              <div class="flex items-end gap-2 relative z-10">
                <h3 class="text-4xl font-black text-white">${totalPcsPolos}</h3>
                <span class="text-sm font-bold text-gray-400 mb-1">PCS</span>
              </div>
              <p class="text-sm font-bold text-secondary mt-1 relative z-10">${totalKodiPolos} Kodi</p>
            </div>
            
            <div class="bg-gradient-to-br from-blue-500/20 to-blue-600/10 border border-blue-500/30 p-5 rounded-2xl shadow-lg relative overflow-hidden">
              <div class="absolute -right-4 -top-4 text-blue-500/10"><i class="fas fa-tags text-7xl"></i></div>
              <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1 relative z-10">Hasil Op. Label</p>
              <div class="flex items-end gap-2 relative z-10">
                <h3 class="text-4xl font-black text-white">${totalPcsLabel}</h3>
                <span class="text-sm font-bold text-gray-400 mb-1">PCS</span>
              </div>
              <p class="text-sm font-bold text-blue-300 mt-1 relative z-10">${totalKodiLabel} Kodi</p>
            </div>
          </div>
          
          <div class="bg-surface p-5 rounded-2xl shadow-md border border-gray-800 mb-6">
            <h3 class="text-sm font-bold text-white mb-4 border-b border-gray-700 pb-2"><i class="fas fa-layer-group text-primary mr-2"></i>Rincian Corak & Kode (Op. Polos)</h3>
            <div class="space-y-3 max-h-48 overflow-y-auto hide-scrollbar">
              ${corakItemsHtml}
            </div>
          </div>

          <div class="bg-surface p-5 rounded-2xl shadow-md border border-gray-800 mb-6">
            <h3 class="text-sm font-bold text-white mb-4 border-b border-gray-700 pb-2"><i class="fas fa-tags text-blue-400 mr-2"></i>Rincian Jenis Label (Op. Label)</h3>
            <div class="space-y-3 max-h-48 overflow-y-auto hide-scrollbar">
              ${labelItemsHtml}
            </div>
          </div>

          <div class="bg-surface p-5 rounded-2xl shadow-md border border-gray-800 mb-6">
            <h3 class="text-sm font-bold text-white mb-4 border-b border-gray-700 pb-2"><i class="fas fa-chart-bar text-primary mr-2"></i>Distribusi Grid (Op. Polos)</h3>
            <div class="h-48"><canvas id="gridChart"></canvas></div>
          </div>
          
          <div class="bg-surface p-5 rounded-2xl shadow-md border border-gray-800 mb-6">
            <h3 class="text-sm font-bold text-white mb-4 border-b border-gray-700 pb-2"><i class="fas fa-user-clock text-primary mr-2"></i>Detail Absensi Hari Ini</h3>
            
            <div class="flex gap-4 mb-4">
              <div class="flex-1 bg-gray-900 rounded-xl p-3 border border-gray-700 text-center">
                <p class="text-2xl font-black text-white">${totalHadir}</p>
                <p class="text-[10px] text-gray-400 font-bold uppercase">Total Hadir</p>
                <div class="mt-2 flex justify-center gap-3 text-[9px] font-bold">
                   <span class="text-green-400">Polos: ${hadirPolos}</span>
                   <span class="text-blue-400">Label: ${hadirLabel}</span>
                </div>
              </div>
              <div class="flex-1 bg-gray-900 rounded-xl p-3 border border-red-900/50 text-center">
                <p class="text-2xl font-black text-red-500">${listTidakHadir.length}</p>
                <p class="text-[10px] text-red-400 font-bold uppercase">Tidak Hadir</p>
              </div>
            </div>

            ${htmlTidakHadir}
          </div>

          <div class="bg-surface p-5 rounded-2xl shadow-md border border-gray-800 mb-6">
            <h3 class="text-sm font-bold text-white mb-4 border-b border-gray-700 pb-2"><i class="fas fa-trophy text-primary mr-2"></i>Kinerja Op. Polos</h3>
            <div class="space-y-3">
              ${kPcsHtml}
            </div>
          </div>

          <div class="bg-surface p-5 rounded-2xl shadow-md border border-gray-800 mb-6">
            <h3 class="text-sm font-bold text-white mb-3"><i class="fas fa-edit text-primary mr-2"></i>Catatan Laporan Harian</h3>
            <textarea id="input-catatan" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-sm text-gray-300 focus:outline-none focus:border-primary min-h-[100px]" placeholder="Ketik catatan tambahan di sini untuk dicetak di laporan PDF/Excel...">${state.catatanLaporan || ''}</textarea>
            <button onclick="ui.saveCatatan()" class="w-full mt-3 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 font-bold py-2.5 rounded-xl transition-colors text-xs">Simpan Catatan</button>
          </div>
        `;
        container.innerHTML = html;
        
        const ctx = document.getElementById('gridChart');
        if (ctx) {
          const gLabels = Object.keys(gridData);
          const gData = Object.values(gridData);
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: gLabels.length ? gLabels : ['-'],
              datasets: [{
                label: 'PCS (Op. Polos)',

                backgroundColor: '#2ddccb',

              }]

        const c = document.getElementById('input-catatan').value;
        state.catatanLaporan = c;
        this.toast('Catatan tersimpan sementara', 'success');
      },

              <div class="bg-gray-900 p-5 flex justify-between items-center border-b border-gray-800">
                <h3 class="font-black text-white text-lg"><i class="fas fa-download text-primary mr-2"></i>Pilih Laporan</h3>
                <button onclick="ui.closeModal()" class="text-gray-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
              </div>
              <div class="p-5 space-y-4">
                
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                  <p class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">1. Laporan Produksi</p>
                  <div class="grid grid-cols-2 gap-3">
                    <button onclick="ui.exportPDF('produksi'); ui.closeModal();" class="bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-bold text-sm transition-colors flex justify-center items-center gap-2"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button onclick="ui.exportExcel('produksi'); ui.closeModal();" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold text-sm transition-colors flex justify-center items-center gap-2"><i class="fas fa-file-excel"></i> Excel</button>
                  </div>
                </div>

                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                  <p class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">2. Laporan Absensi</p>
                  <div class="grid grid-cols-2 gap-3">
                    <button onclick="ui.exportPDF('absensi'); ui.closeModal();" class="bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-bold text-sm transition-colors flex justify-center items-center gap-2"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button onclick="ui.exportExcel('absensi'); ui.closeModal();" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold text-sm transition-colors flex justify-center items-center gap-2"><i class="fas fa-file-excel"></i> Excel</button>
                  </div>
                </div>

              </div>
            </div>
          </div>`;
        document.getElementById('modal-container').innerHTML = html;
      },

      exportPDF(type) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const dateStr = getToday();
        
        doc.setFontSize(16);
        doc.text(`CHECKER - Laporan ${type === 'produksi' ? 'Produksi' : 'Absensi'}`, 14, 15);
        doc.setFontSize(10);
        doc.text(`Tanggal: ${dateStr}`, 14, 22);
        
        let currentY = 30;
        
        if (type === 'produksi') {
            const prodToday = state.produksi.filter(p => p.tanggal === dateStr);
            const prodPolos = prodToday.filter(p => { const k = state.karyawan.find(x => x.id === p.karyawanId); return k && k.statusOp !== 'Op. Jahit Label'; });
            const prodLabel = prodToday.filter(p => { const k = state.karyawan.find(x => x.id === p.karyawanId); return k && k.statusOp === 'Op. Jahit Label'; });
            
            const tPolos = prodPolos.reduce((s,p) => s + Number(p.pcs), 0);
            const tLabel = prodLabel.reduce((s,p) => s + Number(p.pcs), 0);
            doc.text(`Total Op. Polos: ${tPolos} PCS (${(tPolos/20).toFixed(2)} Kodi)`, 14, 30);
            doc.text(`Total Op. Label: ${tLabel} PCS (${(tLabel/20).toFixed(2)} Kodi)`, 14, 36);

            doc.text(`Rincian Input (Op. Jahit Polos):`, 14, 46);
            const tableDataPolos = prodPolos.map(p => [
              new Date(p.timestamp).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}),
              p.karyawanNama, p.corak, p.kodeCorak, p.grid, p.pcs, p.kodi, (p.adminName || '-')
            ]);
            
            doc.autoTable({
              startY: 50,
              head: [['Waktu', 'Operator', 'Corak', 'Kode', 'Grid', 'PCS', 'Kodi', 'Admin']],
              body: tableDataPolos,
              theme: 'grid', styles: { fontSize: 8 }
            });
            
            currentY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 10 : 60;
            if (currentY > 260) { doc.addPage(); currentY = 20; }
            doc.text(`Rincian Input (Op. Jahit Label):`, 14, currentY);
            const tableDataLabel = prodLabel.map(p => [
              new Date(p.timestamp).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}),
              p.karyawanNama, p.corak, p.kodeCorak, p.jenisLabel || '-', p.grid, p.pcs, p.kodi, (p.adminName || '-')
            ]);
            
            doc.autoTable({
              startY: currentY + 4,
              head: [['Waktu', 'Operator', 'Corak', 'Kode', 'Label', 'Grid', 'PCS', 'Kodi', 'Admin']],
              body: tableDataLabel,
              theme: 'grid', styles: { fontSize: 8 }
            });
            currentY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 10 : currentY + 20;
        } 
        else if (type === 'absensi') {
            const activeKaryawan = state.karyawan.filter(k => !k.deleted);
            const karyawanPolos = activeKaryawan.filter(k => k.statusOp !== 'Op. Jahit Label');
            const karyawanLabel = activeKaryawan.filter(k => k.statusOp === 'Op. Jahit Label');

            // 1. Tabel Absensi Op. Polos
            doc.text(`Daftar Absensi (Op. Jahit Polos):`, 14, 30);
            const tableDataPolos = karyawanPolos.map(k => [
               k.nik, k.nama, k.statusOp, ui.getAutoStatus(k)
            ]);
            doc.autoTable({
              startY: 34,
              head: [['NIK', 'Nama Karyawan', 'Posisi', 'Status Kehadiran']],
              body: tableDataPolos,
              theme: 'grid', styles: { fontSize: 9 }
            });
            
            // 2. Tabel Absensi Op. Label
            currentY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 10 : 60;
            if (currentY > 260) { doc.addPage(); currentY = 20; }
            doc.text(`Daftar Absensi (Op. Jahit Label):`, 14, currentY);
            const tableDataLabel = karyawanLabel.map(k => [
               k.nik, k.nama, k.statusOp, ui.getAutoStatus(k)
            ]);
            doc.autoTable({
              startY: currentY + 4,
              head: [['NIK', 'Nama Karyawan', 'Posisi', 'Status Kehadiran']],
              body: tableDataLabel,
              theme: 'grid', styles: { fontSize: 9 }
            });
            
            currentY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 10 : currentY + 20;
            
            // 3. Menghitung Ringkasan Detail Absensi (Sesuai Gambar)
            let hadirPolos = 0, hadirLabel = 0;
            let listTidakHadir = [];
            activeKaryawan.forEach(k => {
              const status = ui.getAutoStatus(k);
              if (status === 'Hadir') {
                if (k.statusOp === 'Op. Jahit Label') hadirLabel++;
                else hadirPolos++;
              } else {
                listTidakHadir.push(`${k.nama} (${status})`);
              }
            });
            const totalHadir = hadirPolos + hadirLabel;
            
            if (currentY > 250) { doc.addPage(); currentY = 20; }

            // Merender teks "Detail Absensi Hari Ini" ke dalam PDF
            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.text("Detail Absensi Hari Ini:", 14, currentY);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            currentY += 6;
            doc.text(`Total Hadir: ${totalHadir} (Polos: ${hadirPolos}, Label: ${hadirLabel})`, 14, currentY);
            currentY += 6;
            doc.text(`Tidak Hadir: ${listTidakHadir.length}`, 14, currentY);
            currentY += 6;
            
            let ketTidakHadir = listTidakHadir.length > 0 ? `Keterangan: ${listTidakHadir.join(', ')}` : "Semua karyawan hadir hari ini!";
            const splitKet = doc.splitTextToSize(ketTidakHadir, 180);
            doc.text(splitKet, 14, currentY);
            currentY += (splitKet.length * 5) + 5;
        }

        if (state.catatanLaporan) {
           if (currentY > 260) { doc.addPage(); currentY = 20; }
           doc.setFontSize(10);
           doc.setFont("helvetica", "bold");
           doc.text("Catatan Harian:", 14, currentY);
           doc.setFont("helvetica", "normal");
           doc.setFontSize(9);
           
           const splitText = doc.splitTextToSize(state.catatanLaporan, 180);
           doc.text(splitText, 14, currentY + 6);
        }

        doc.save(`Laporan_${type}_${dateStr}.pdf`);
        this.toast('PDF Berhasil Diunduh');
      },

      exportExcel(type) {
        const dateStr = getToday();
        const wb = XLSX.utils.book_new();
        
        if (type === 'produksi') {
            const prodToday = state.produksi.filter(p => p.tanggal === dateStr);
            const prodPolos = prodToday.filter(p => { const k = state.karyawan.find(x => x.id === p.karyawanId); return k && k.statusOp !== 'Op. Jahit Label'; });
            const prodLabel = prodToday.filter(p => { const k = state.karyawan.find(x => x.id === p.karyawanId); return k && k.statusOp === 'Op. Jahit Label'; });

            const dataPolos = prodPolos.map(p => ({
              Waktu: new Date(p.timestamp).toLocaleTimeString('id-ID'),
              Operator: p.karyawanNama, Corak: p.corak, Kode: p.kodeCorak, Grid: p.grid, PCS: p.pcs, Kodi: p.kodi, Admin: p.adminName
            }));
            const wsPolos = XLSX.utils.json_to_sheet(dataPolos.length ? dataPolos : [{Waktu: '-', Operator: 'Kosong'}]);
            XLSX.utils.book_append_sheet(wb, wsPolos, "Rincian Polos");

            const dataLabel = prodLabel.map(p => ({
              Waktu: new Date(p.timestamp).toLocaleTimeString('id-ID'),
              Operator: p.karyawanNama, Corak: p.corak, Kode: p.kodeCorak, "Jenis Label": p.jenisLabel || '-', Grid: p.grid, PCS: p.pcs, Kodi: p.kodi, Admin: p.adminName
            }));
            const wsLabel = XLSX.utils.json_to_sheet(dataLabel.length ? dataLabel : [{Waktu: '-', Operator: 'Kosong'}]);
            XLSX.utils.book_append_sheet(wb, wsLabel, "Rincian Label");

            const tPolos = prodPolos.reduce((s,p) => s + Number(p.pcs), 0);
            const tLabel = prodLabel.reduce((s,p) => s + Number(p.pcs), 0);
            const wsRekapProd = XLSX.utils.json_to_sheet([
                { "Kategori": "Op. Jahit Polos", "Total PCS": tPolos, "Total Kodi": (tPolos/20).toFixed(2) },
                { "Kategori": "Op. Jahit Label", "Total PCS": tLabel, "Total Kodi": (tLabel/20).toFixed(2) }
            ]);
            XLSX.utils.book_append_sheet(wb, wsRekapProd, "Rekap Produksi");
        } 
        else if (type === 'absensi') {
            const activeKaryawan = state.karyawan.filter(k => !k.deleted);
            const karyawanPolos = activeKaryawan.filter(k => k.statusOp !== 'Op. Jahit Label');
            const karyawanLabel = activeKaryawan.filter(k => k.statusOp === 'Op. Jahit Label');

            // 1. Sheet Absensi Op. Polos
            const dataAbsenPolos = karyawanPolos.map(k => ({
               NIK: k.nik, Nama: k.nama, Posisi: k.statusOp, Status: ui.getAutoStatus(k)
            }));
            const wsAbsenPolos = XLSX.utils.json_to_sheet(dataAbsenPolos.length ? dataAbsenPolos : [{NIK: '-', Nama: 'Kosong'}]);
            XLSX.utils.book_append_sheet(wb, wsAbsenPolos, "Absensi Polos");

            // 2. Sheet Absensi Op. Label
            const dataAbsenLabel = karyawanLabel.map(k => ({
               NIK: k.nik, Nama: k.nama, Posisi: k.statusOp, Status: ui.getAutoStatus(k)
            }));
            const wsAbsenLabel = XLSX.utils.json_to_sheet(dataAbsenLabel.length ? dataAbsenLabel : [{NIK: '-', Nama: 'Kosong'}]);
            XLSX.utils.book_append_sheet(wb, wsAbsenLabel, "Absensi Label");
            
            // 3. Menghitung Ringkasan Detail Absensi (Sesuai Gambar)
            let hadirPolos = 0, hadirLabel = 0;
            let listTidakHadir = [];
            activeKaryawan.forEach(k => {
              const status = ui.getAutoStatus(k);
              if (status === 'Hadir') {
                if (k.statusOp === 'Op. Jahit Label') hadirLabel++;
                else hadirPolos++;
              } else {
                listTidakHadir.push(`${k.nama} (${status})`);
              }
            });
            const totalHadir = hadirPolos + hadirLabel;

            // Sheet Terpisah khusus Ringkasan
            const rekapData = [
               { "Detail Absensi": "Total Hadir", "Keterangan": totalHadir.toString() },
               { "Detail Absensi": "- Polos", "Keterangan": hadirPolos.toString() },
               { "Detail Absensi": "- Label", "Keterangan": hadirLabel.toString() },
               { "Detail Absensi": "Tidak Hadir", "Keterangan": listTidakHadir.length.toString() },
               { "Detail Absensi": "Status Karyawan", "Keterangan": listTidakHadir.length > 0 ? listTidakHadir.join(', ') : "Semua karyawan hadir hari ini!" }
            ];
            const wsRekap = XLSX.utils.json_to_sheet(rekapData);
            XLSX.utils.book_append_sheet(wb, wsRekap, "Rekap Detail Absensi");
        }

        if (state.catatanLaporan) {
           const wsCatatan = XLSX.utils.json_to_sheet([{ Catatan_Harian: state.catatanLaporan }]);
           XLSX.utils.book_append_sheet(wb, wsCatatan, "Catatan");
        }

        XLSX.writeFile(wb, `Laporan_${type}_${dateStr}.xlsx`);
        this.toast('Excel Berhasil Diunduh');
      }
    };

    auth.onAuthStateChanged(user => {
      if (user) {
        state.userId = user.uid;
        
        onSnapshot(docPath('master', 'master_data'), docSnap => {
          if(docSnap.exists()) {
             state.master = { ...defaultMaster, ...docSnap.data() };
          } else {
             state.master = JSON.parse(JSON.stringify(defaultMaster));
          }
          if (document.getElementById('input-master-corak')) ui.renderMasterSettings('corak');
        });

        onSnapshot(colPath('karyawan'), snap => {
          state.karyawan = snap.docs.map(d => d.data());
          if (state.tab === 'karyawan') ui.renderKaryawan();
          if (state.tab === 'produksi') ui.renderProduksi();
        });

        const qProd = colPath('produksi');
        onSnapshot(qProd, snap => {
          state.produksi = snap.docs.map(d => d.data());
          if (state.tab === 'produksi') ui.renderProduksi();
          if (state.tab === 'laporan') ui.renderLaporan();
        });

        onSnapshot(colPath('absensi'), snap => {
          state.absensi = snap.docs.map(d => d.data());
          if (state.tab === 'karyawan') ui.renderKaryawan();
          if (state.tab === 'laporan') ui.renderLaporan();
        });

           } else {
        signInAnonymously(auth).catch(e => {
          console.error('Anonymous Authentication failed:', e);
          ui.toast(`Error Auth: ${e.code || e.message}`, 'error');
        });
      }

    });

    window.onload = () => {
      ui.updateAdminUI();
      ui.switchTab('produksi');
    };
  </script>
</body>
</html>
